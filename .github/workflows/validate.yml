name: Validate portfolio

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check generated pages and metadata
        run: |
          python tools/build-travel.py --check
          python tools/build-seo.py --check
          python tests/travel-build.py
      - name: Install browser test runner
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Run browser validation
        shell: bash
        run: |
          python -m http.server 4173 >/tmp/eyesofnydh-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          export PLAYWRIGHT_MODULE="$PWD/node_modules/playwright"
          node tests/refinement.cjs
          node tests/gallery-ui.cjs
          node tests/improvements.cjs
          node tests/ios-motion.cjs
          node tests/safari.cjs
